components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        role:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        photo_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        bio:
          type: string
          nullable: true
        is_active:
          type: boolean
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - email
      - id
      - name
    Amenity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        icon:
          type: string
          maxLength: 100
      required:
      - id
      - name
    AreaConverter:
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
        units:
          type: object
          additionalProperties: {}
      required:
      - units
      - updated_at
    BlogPost:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          type: string
          nullable: true
          maxLength: 255
        excerpt:
          type: string
          nullable: true
        content:
